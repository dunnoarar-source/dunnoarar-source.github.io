<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celine Trade Concept</title>
    <meta
      name="description"
      content="Celine Trade Concept developer site for 00數簿 (00 Ledger) and related apps."
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #2f3a2c;
        --muted: #647459;
        --paper: #fff8eb;
        --card: #f9ede0;
        --line: #d7c4a6;
        --accent: #54765a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #f2d8ab 0, transparent 42%),
          linear-gradient(180deg, #fff8eb 0%, #f4ebe0 100%);
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      .card {
        background: rgba(249, 237, 224, 0.92);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px 24px;
        box-shadow: 0 10px 30px rgba(79, 65, 38, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.6;
      }
      ul {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      .link {
        display: block;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--paper);
        border: 1px solid var(--line);
      }
      .note {
        margin-top: 18px;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Celine Trade Concept</h1>
        <p>
          開發者網站 · Developer site for
          <strong>00數簿 (00 Ledger)</strong> and related apps.
        </p>
        <ul>
          <li>
            <a class="link" href="./app-ads.txt">app-ads.txt</a>
          </li>
          <li>
            <a class="link" href="./terms.html">Terms</a>
          </li>
          <li>
            <a class="link" href="./bunnyseek-terms.html">BunnySeek Terms</a>
          </li>
        </ul>
        <p class="note">
          This page exists so the Play Console developer website root resolves
          correctly for AdMob <code>app-ads.txt</code> verification.
        </p>
      </section>
    </main>
  </body>
</html>
